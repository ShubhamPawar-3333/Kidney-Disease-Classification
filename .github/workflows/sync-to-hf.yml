name: Sync to Hugging Face Spaces

on:
  push:
    branches: [master]
  workflow_dispatch:  # Manual trigger

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
        run: |
          git remote add hf https://AIenthusSP:$HF_TOKEN@huggingface.co/spaces/AIenthusSP/kidney-disease-classifier
          git push hf master:main --force
