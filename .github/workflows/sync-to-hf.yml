name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create clean directory for HF
        run: |
          mkdir hf-deploy
          
          # Create HuggingFace README with config
          cat > hf-deploy/README.md << 'EOF'
          ---
          title: Kidney Disease Classifier
          emoji: 🩺
          colorFrom: blue
          colorTo: purple
          sdk: docker
          pinned: false
          ---
          
          # Kidney Disease Classification
          AI-powered kidney tumor detection from CT scans using VGG16 transfer learning.
          EOF
          
          # Copy required files
          cp app.py hf-deploy/
          cp Dockerfile hf-deploy/
          cp requirements.txt hf-deploy/
          cp -r templates hf-deploy/
          
      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
        run: |
          cd hf-deploy
          git init -b main
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m "Deploy to HuggingFace Spaces"
          git remote add origin https://AIenthusSP:$HF_TOKEN@huggingface.co/spaces/AIenthusSP/kidney-disease-classifier
          git push origin main --force
